<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toothsi claims</title>
<style>
  html,body{margin:0;height:100%;background:#F7FAFC;font-family:Arial,sans-serif}
  iframe{border:0;width:100%;height:100%;display:block}
  .msg{color:#555;text-align:center;padding-top:20vh}
</style>
<script>
  // Block right-click, F12 and the usual DevTools / view-source shortcuts
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var c = e.code, m = e.ctrlKey || e.metaKey;
    if (e.key === 'F12' ||
        (m && (e.shiftKey || e.altKey) && (c === 'KeyI' || c === 'KeyJ' || c === 'KeyC')) ||
        (m && c === 'KeyU')) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
</script>
</head>
<body>
<script>
  var APP_URL = 'https://script.google.com/a/macros/toothsi.in/s/AKfycbxoITve2FDiBlUDfAJL5Fu0c1Qz2TvMzu1h4orpScn7RB-V34IYGYSRLwEGLoOlfNcwBg/exec';
  var d = new URLSearchParams(location.search).get('d') || '';
  if (/^[A-Za-z0-9_-]{6,80}$/.test(d)) {
    document.write('<iframe src="' + APP_URL + '?d=' + encodeURIComponent(d) + '" allow="clipboard-write"></iframe>');
  } else {
    document.write('<p class="msg">This claim link is incomplete. Use the button in the claim email.</p>');
  }
</script>
</body>
</html>
